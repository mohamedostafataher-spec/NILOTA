<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1330">
<title>NILORA Lite</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a1330;--card:#111c3f;--line:#22305f;--gold:#d9b45b;--txt:#f2f4fa;--mut:#8e9ac0}
:root[data-t=light]{--bg:#f6f1e6;--card:#fffdf8;--line:#e4dac3;--gold:#a8791a;--txt:#1d2540;--mut:#7a7466}
nav{background:var(--bg)!important}.chips{scrollbar-width:none;display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.chips button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font-size:14px}.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{letter-spacing:.2em;color:var(--gold);font-size:15px}
header small{color:var(--mut)}
main{flex:1;overflow:auto;padding:0 16px 16px}
.langs{display:flex;gap:8px;align-items:center;margin-bottom:12px}
select{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px}
.swap{background:var(--card);border:1px solid var(--line);color:var(--gold);border-radius:50%;width:44px;height:44px;font-size:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:90px;background:transparent;border:0;color:var(--txt);font-size:20px;resize:none;outline:none;font-family:inherit}
.out{min-height:90px;font-size:22px;color:var(--gold);white-space:pre-wrap}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.ic{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:8px 12px;font-size:15px}
.mic{display:block;margin:10px auto;width:84px;height:84px;border-radius:50%;border:0;background:linear-gradient(145deg,#e8c670,#b8902f);color:#1a1a1a;font-size:34px;box-shadow:0 6px 24px #d9b45b44}
.mic.on{animation:p 1s infinite;background:linear-gradient(145deg,#ff8a7a,#c0392b)}
@keyframes p{50%{transform:scale(1.08)}}
.hint{color:var(--mut);text-align:center;font-size:13px;min-height:18px}
.ph{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border:0}.ph div:first-child{font-size:16px}.ph div:last-child{color:var(--gold);font-size:16px;text-align:right}
nav{display:flex;border-top:1px solid var(--line);background:#0a1330;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--gold)}
.hist{padding:10px 0;border-bottom:1px solid var(--line)}.hist small{color:var(--mut)}
[hidden]{display:none!important}#show[hidden]{display:none!important}
.chips::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div id="app">
<header><b>NILORA ☥</b><small id="net"></small></header>
<main>
<section id="tr">
 <div class="langs"><select id="from"></select><button class="swap" id="swap">⇄</button><select id="to"></select></div>
 <div class="box"><textarea id="src" placeholder="Type or tap the mic…"></textarea><div class="row"><button class="ic" id="clr">✕</button></div></div>
 <div class="box"><div class="out" id="out"></div><div class="row"><button class="ic" id="say">🔊</button><button class="ic" id="copy">⧉</button></div></div>
 <div class="chips" id="chips"></div>
 <button class="mic" id="mic">🎤</button>
 <div class="hint" id="hint"></div>
</section>
<section id="sit" hidden><div class="chips" id="cats"></div><div class="box" id="sitl"></div><div class="hint">Tap a card to show it full screen, in the language of the person you are talking to (the right-hand language above).</div></section>
<section id="hs" hidden><div class="box" id="hsl"></div></section>
<section id="st" hidden><div class="box"><div class="set"><span>Theme</span><button class="ic" id="th">Dark / Light</button></div><div class="set"><span>Egyptian Arabic style</span><button class="ic" id="eg">On</button></div><div class="set"><span>Clear history</span><button class="ic" id="ch">Clear</button></div><div class="set"><span>Voice replies</span><button class="ic" id="vr">On</button></div><div class="hint" style="margin-top:12px">NILORA Lite. Translation needs a connection, quick phrases work offline.</div></div></section>
</main>
<div id="show" hidden style="position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center"><div id="sh1" style="font-size:38px;color:var(--gold);line-height:1.4;font-weight:700"></div><div id="sh2" style="font-size:18px;color:var(--mut);margin-top:14px"></div><div id="sh3" style="font-size:15px;color:var(--mut);margin-top:6px"></div><button class="ic" id="shs" style="margin-top:28px;font-size:18px;padding:12px 22px">🔊 Play</button><button class="ic" id="shx" style="margin-top:12px">Close</button></div>
<nav>
 <button id="n1" class="on"><span>🌐</span>Translate</button>
 <button id="n5"><span>🧭</span>Situations</button>
 <button id="n4" onclick="location.href='call.html'"><span>📞</span>Call</button>
 <button id="n2"><span>🕘</span>History</button>
 <button id="n3"><span>⚙️</span>Settings</button>
</nav>
</div>
<script>
(function(){
var L=[['en','English','en-US'],['ar','العربية (مصر)','ar-EG'],['fr','Français','fr-FR'],['ru','Русский','ru-RU']];
var $=function(i){return document.getElementById(i)};
var from=$('from'),to=$('to'),src=$('src'),out=$('out'),hint=$('hint');
L.forEach(function(l){from.add(new Option(l[1],l[0]));to.add(new Option(l[1],l[0]))});
from.value=localStorage.getItem('nl.from')||'ar';to.value=localStorage.getItem('nl.to')||'en';
var PH={ // offline phrasebook (EN source)

 'Thank you':{ar:'شكراً',fr:'Merci',ru:'Спасибо'},

 'Where is the toilet?':{ar:'الحمام فين؟',fr:'Où sont les toilettes ?',ru:'Где туалет?'},

 'Too expensive':{ar:'غالي أوي',fr:'Trop cher',ru:'Слишком дорого'},

 'Do you speak English?':{ar:'بتتكلم إنجليزي؟',fr:'Parlez-vous anglais ?',ru:'Вы говорите по-английски?'},

$('vr').onclick=function(){voice=!voice;localStorage.setItem('nl.voice',voice?'on':'off');$('vr').textContent=voice?'On':'Off'};
function rtl(){out.style.direction=to.value==='ar'?'rtl':'ltr';src.style.direction=from.value==='ar'?'rtl':'ltr'}
var H=JSON.parse(localStorage.getItem('nl.hist')||'[]');
function save(a,b){H.unshift({a:a,b:b,f:from.value,t:to.value});H=H.slice(0,30);localStorage.setItem('nl.hist',JSON.stringify(H))}
var tm=null,seq=0;

var EG=[['لا أعرف','معرفش'],['لا أفهم','مش فاهم'],['لا يوجد','مفيش'],['لا أستطيع','مش قادر'],['من فضلك','لو سمحت'],['من فضلك','لو سمحت'],['ماذا','إيه'],['أين','فين'],['كيف','إزاي'],['لماذا','ليه'],['متى','إمتى'],['كم','كام'],['بكم','بكام'],['الآن','دلوقتي'],['أريد','عايز'],['أرغب في','عايز'],['أود','عايز'],['نريد','عايزين'],['هذا','ده'],['هذه','دي'],['هؤلاء','دول'],['الذي','اللي'],['التي','اللي'],['ليس','مش'],['لست','مش'],['ليست','مش'],['جدا','أوي'],['جداً','أوي'],['كثيرا','كتير'],['كثير','كتير'],['نعم','أيوه'],['ماء','مية'],['الماء','المية'],['المرحاض','الحمّام'],['دورة المياه','الحمّام'],['الآن','دلوقتي'],['غدا','بكرة'],['غداً','بكرة'],['اليوم','النهاردة'],['أنا أحتاج','أنا محتاج'],['أحتاج','محتاج'],['تريد','عايز'],['يمكنني','أقدر'],['يمكنك','تقدر'],['هل يمكنك','ممكن'],['هل يمكن','ممكن'],['ماذا تريد','عايز إيه'],['شيء','حاجة'],['أي شيء','أي حاجة'],['الان','دلوقتي'],['أيضا','كمان'],['أيضاً','كمان'],['فقط','بس'],['لكن','بس'],['حسنا','تمام'],['حسناً','تمام'],['جيد','كويس'],['رائع','جميل'],['سيارة الأجرة','التاكسي'],['حافلة','أوتوبيس'],['قطار الأنفاق','المترو'],['الطبيب','الدكتور'],['طبيب','دكتور'],['الشرطة','الشرطة'],['منزل','بيت'],['المنزل','البيت'],['ذهب','راح'],['أذهب','أروح'],['سأذهب','هروح'],['إلى أين','رايح فين'],['ماذا حدث','إيه اللي حصل'],['مرحبا','أهلاً'],['مرحباً','أهلاً'],['شكرا','شكراً'],['أنت','إنت'],['أنتِ','إنتي'],['نحن','إحنا'],['لديك','عندك'],['لدي','عندي'],['لديه','عنده'],['لدينا','عندنا'],['أمامي','قدامي'],['الآن','دلوقتي']]
EG.sort(function(a,b){return b[0].length-a[0].length});
function egy(t){if(!t)return t;t=t.replace(/(^|[\s،؟?.!,])هل\s+(?!يمكن)/g,'$1');
 var d='(^|[\\s،؟?.!,])',e='(?=$|[\\s،؟?.!,])';
 EG.forEach(function(p){try{t=t.replace(new RegExp(d+p[0].trim().replace(/ /g,'\\s+')+e,'g'),function(m,a){return a+p[1]})}catch(x){}});
 t=t.replace(/(^|\s)سوف\s+أ/g,'$1ه').replace(/(^|\s)سوف\s+/g,'$1ه');
 return t}
var egOn=localStorage.getItem('nl.eg')!=='off';setTimeout(function(){var b=$('eg');b.textContent=egOn?'On':'Off';b.onclick=function(){egOn=!egOn;localStorage.setItem('nl.eg',egOn?'on':'off');b.textContent=egOn?'On':'Off'}},0);
var arVoice=null;
function pickVoice(){var vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];var a=vs.filter(function(v){return /^ar/i.test(v.lang)});
 arVoice=a.filter(function(v){return /EG/i.test(v.lang.replace('_','-'))})[0]||null;arVoiceAny=a[0]||null;return arVoice}
var arVoiceAny=null;
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function translate(){
 rtl();localStorage.setItem('nl.from',from.value);localStorage.setItem('nl.to',to.value);
 var q=src.value.trim();if(!q){out.textContent='';hint.textContent='';return}
 if(from.value===to.value){out.textContent=q;return}
 var my=++seq;hint.textContent='…';
 // offline phrasebook first (exact match from English)
 if(from.value==='en'&&PH[q]&&PH[q][to.value]){out.textContent=PH[q][to.value];hint.textContent='offline';return}
 var u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+from.value+'|'+to.value;
 fetch(u).then(function(r){return r.json()}).then(function(j){
  if(my!==seq)return;var t=j&&j.responseData&&j.responseData.translatedText;
  if(!t||/MYMEMORY WARNING/i.test(t)){out.textContent='';hint.textContent='Translation limit reached or offline. Try the Phrases tab.';return}
  t=t.replace(/&#39;/g,"'").replace(/&quot;/g,'"');var raw=t;if(to.value==='ar'&&egOn)t=egy(t);out.textContent=t;hint.textContent=(to.value==='ar'&&egOn)?'Egyptian style (rule-based, from formal Arabic)':'';save(q,out.textContent);
 }).catch(function(){if(my===seq){out.textContent='';hint.textContent='No connection. Try the Phrases tab (works offline).'}});
}
src.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(translate,450)});
from.onchange=to.onchange=translate;
$('swap').onclick=function(){var f=from.value;from.value=to.value;to.value=f;if(out.textContent){src.value=out.textContent}translate()};
$('clr').onclick=function(){src.value='';out.textContent='';hint.textContent=''};
function code(c){for(var i=0;i<L.length;i++)if(L[i][0]===c)return L[i][2]}
function speak(t,c){if(!voice||!window.speechSynthesis||!t)return;var u=new SpeechSynthesisUtterance(t);u.lang=code(c);if(c==='ar'){pickVoice();var vv=arVoice||arVoiceAny;if(vv){u.voice=vv;u.lang=vv.lang}}u.rate=0.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
$('say').onclick=function(){var v=voice;voice=true;speak(out.textContent,to.value);voice=v};
$('copy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(out.textContent);hint.textContent='Copied'};

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function chromeLink(){var u='intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;end';return u}
function micErr(code){var m={'not-allowed':'Microphone is blocked. In Chrome tap the lock icon next to the address, open Permissions, set Microphone to Allow, then try again. Also check Android Settings > Apps > Chrome > Permissions > Microphone.',

 'no-speech':'I did not hear anything. Tap the mic and speak right away.',
 'audio-capture':'No working microphone found, or another app is using it. Close other apps that use the mic and try again.',

 'language-not-supported':'This language is not supported for voice on your phone. Type instead.',

 return m[code]!==undefined?m[code]:('Mic problem: '+code)}
function noSR(){return 'Voice input is not available in this browser (in-app browsers inside Telegram, WhatsApp or Facebook block it). Open the page in Chrome: '}
function preflight(){ // ask permission inside the tap, then release the mic so recognition can use it
 if(!window.isSecureContext)return Promise.reject('not-allowed');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.resolve();
 return navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){s.getTracks().forEach(function(t){t.stop()})}).catch(function(e){throw (e&&e.name==='NotAllowedError'||e&&e.name==='SecurityError')?'not-allowed':(e&&e.name==='NotFoundError'||e&&e.name==='NotReadableError')?'audio-capture':'audio-capture'})}
function diag(){return 'https:'+(window.isSecureContext?'yes':'NO')+' speech:'+(SR?'yes':'no')+' mic-api:'+((navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?'yes':'no')}
var rec=null,gotText=false;
function showHint(t,link){hint.textContent=t;if(link){var a=document.createElement('a');a.href=chromeLink();a.textContent='Open in Chrome';a.style.cssText='color:var(--gold);margin-left:6px';hint.appendChild(a)}}
function begin(lang,retried){
 rec=new SR();rec.lang=lang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;gotText=false;var err='';
 $('mic').className='mic on';showHint('Listening… ('+lang+')');
 rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;if(s){gotText=true;src.value=s;clearTimeout(tm);tm=setTimeout(translate,200)}};
 rec.onerror=function(e){err=e.error||'unknown'};
 rec.onend=function(){rec=null;$('mic').className='mic';
  if(err==='language-not-supported'&&lang==='ar-EG'&&!retried){begin('ar-SA',true);return}
  if(err&&err!=='aborted'){showHint(micErr(err)+(err==='not-allowed'||err==='service-not-allowed'?'':''));return}
  if(!gotText){showHint(micErr('no-speech'));return}
  hint.textContent='';translate();setTimeout(function(){speak(out.textContent,to.value)},900)};
 try{rec.start()}catch(e){rec=null;$('mic').className='mic';showHint('Could not start the mic: '+e.message)}}
$('mic').onclick=function(){
 if(!SR){showHint(noSR(),true);return}
 if(rec){rec.stop();return}
 hint.textContent='Asking for microphone…';
 preflight().then(function(){begin(code(from.value),false)}).catch(function(c){showHint(micErr(c))})};
$('net').title=diag();window.NiloraMic={diag:diag};
